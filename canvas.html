<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メモ</title>
<meta id="app-title" name="apple-mobile-web-app-title" content="メモ">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- canvasで作った画像をここに入れる -->
<link id="touch-icon" rel="apple-touch-icon" href="">
<style>
  :root {
    --bg: #EEF0EC; --ink: #1D2320; --sub: #5E6862; --line: #CDD2CC; --card: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1A1E1C; --ink: #E8ECE9; --sub: #9BA59F; --line: #343B37; --card: #232826; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
  }
  main { max-width: 26rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 1.75rem; }
  .preview { display: flex; justify-content: center; margin-bottom: 2rem; }
  .preview img { width: 9rem; height: 9rem; border-radius: 22.5%; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  h2 { font-size: .95rem; margin: 0 0 .6rem; }
  .group { margin-bottom: 1.5rem; }
  input[type="text"] {
    width: 100%; font-size: 1.3rem; padding: .6rem .8rem; border-radius: .6rem;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit;
  }
  .hint { font-size: .8rem; color: var(--sub); margin: .3rem 0 0; }
  .swatches { display: flex; gap: .75rem; flex-wrap: wrap; }
  .swatch {
    width: 3rem; height: 3rem; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    outline: 2px solid transparent; outline-offset: 3px;
  }
  .swatch[aria-pressed="true"] { outline-color: var(--ink); }
  .row { display: flex; gap: .5rem; }
  .opt {
    flex: 1; padding: .6rem; font-size: 1rem; border-radius: .6rem;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .mincho { font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif; font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 3px solid #3B7BD9; outline-offset: 2px; }
  .steps { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem 1.25rem; }
  .steps ol { margin: 0; padding-left: 1.25rem; }
  .status { font-size: .8rem; color: var(--sub); margin-top: 1rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>文字アイコンのテスト</h1>
  <p class="lead">入力した文字でアイコンをその場で作ります。決めてからホーム画面に追加してください。</p>

  <div class="preview"><img id="preview" alt="作ったアイコンのプレビュー"></div>

  <div class="group">
    <h2>文字</h2>
    <input type="text" id="text" value="R8" maxlength="6" autocomplete="off">
    <p class="hint">2〜4文字くらいが読みやすいです。</p>
  </div>

  <div class="group">
    <h2>色</h2>
    <div class="swatches" id="colors">
      <button class="swatch" data-bg="#1F3A5F" data-fg="#FFFFFF" style="background:#1F3A5F" aria-label="藍" aria-pressed="true"></button>
      <button class="swatch" data-bg="#D2452F" data-fg="#FFFFFF" style="background:#D2452F" aria-label="朱" aria-pressed="false"></button>
      <button class="swatch" data-bg="#3E8E5E" data-fg="#FFFFFF" style="background:#3E8E5E" aria-label="若竹" aria-pressed="false"></button>
      <button class="swatch" data-bg="#F2B705" data-fg="#2A2118" style="background:#F2B705" aria-label="山吹" aria-pressed="false"></button>
      <button class="swatch" data-bg="#2B2B2B" data-fg="#FFFFFF" style="background:#2B2B2B" aria-label="墨" aria-pressed="false"></button>
    </div>
  </div>

  <div class="group">
    <h2>書体</h2>
    <div class="row" id="fonts">
      <button class="opt" data-font="gothic" aria-pressed="true" style="font-weight:700">ゴシック</button>
      <button class="opt mincho" data-font="mincho" aria-pressed="false">明朝</button>
    </div>
  </div>

  <div class="group">
    <h2>画像の渡し方（テスト用）</h2>
    <div class="row" id="modes">
      <button class="opt" data-mode="data" aria-pressed="true">data URL</button>
      <button class="opt" data-mode="blob" aria-pressed="false">blob URL</button>
    </div>
    <p class="hint">まずdata URLで試し、反映されなければblob URLも試してください。</p>
  </div>

  <div class="steps">
    <h2>ホーム画面への追加</h2>
    <ol>
      <li>Safariの共有ボタン（□に↑）をタップ</li>
      <li>「ホーム画面に追加」を選ぶ</li>
      <li>アイコンを確認して「追加」</li>
    </ol>
  </div>

  <p class="status" id="status"></p>
</main>

<script>
  const SIZE = 180; // iPhoneのホーム画面アイコンの推奨サイズ
  const FONTS = {
    gothic: '"Hiragino Sans", "Noto Sans JP", sans-serif',
    mincho: '"Hiragino Mincho ProN", "Noto Serif JP", serif'
  };
  const WEIGHTS = { gothic: "800", mincho: "700" };

  const state = { bg: "#1F3A5F", fg: "#FFFFFF", font: "gothic", mode: "data" };
  const input = document.getElementById("text");
  const link = document.getElementById("touch-icon");
  const titleMeta = document.getElementById("app-title");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext("2d");
  let lastBlobUrl = null;

  function draw(text) {
    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, SIZE, SIZE);
    if (!text) return;
    ctx.fillStyle = state.fg;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    // 幅に収まるよう文字サイズを自動調整（左右に余白を残す）
    const maxW = SIZE * 0.78, maxH = SIZE * 0.6;
    let size = maxH;
    const setFont = s => ctx.font = `${WEIGHTS[state.font]} ${s}px ${FONTS[state.font]}`;
    setFont(size);
    let m = ctx.measureText(text);
    if (m.width > maxW) { size = size * maxW / m.width; setFont(size); m = ctx.measureText(text); }
    // 実際のインク部分の高さで上下中央に配置
    const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
    const y = SIZE / 2 + (asc - desc) / 2;
    ctx.fillText(text, SIZE / 2, y);
  }

  function apply() {
    const text = input.value.trim();
    draw(text);
    if (lastBlobUrl) { URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; }

    if (state.mode === "data") {
      const url = canvas.toDataURL("image/png");
      link.setAttribute("href", url);
      preview.src = url;
      status.textContent = `data URL（${url.length.toLocaleString()}文字）を設定済み`;
    } else {
      canvas.toBlob(blob => {
        lastBlobUrl = URL.createObjectURL(blob);
        link.setAttribute("href", lastBlobUrl);
        preview.src = lastBlobUrl;
        status.textContent = "blob URLを設定済み: " + lastBlobUrl;
      }, "image/png");
    }
    // アイコン下の名前の初期値も入力文字にしておく（追加時に編集可）
    const name = text || "メモ";
    document.title = name;
    titleMeta.setAttribute("content", name);
  }

  function wire(groupId, onPick) {
    const buttons = document.querySelectorAll(`#${groupId} button`);
    buttons.forEach(btn => btn.addEventListener("click", () => {
      buttons.forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      onPick(btn.dataset);
      apply();
    }));
  }

  wire("colors", d => { state.bg = d.bg; state.fg = d.fg; });
  wire("fonts", d => { state.font = d.font; });
  wire("modes", d => { state.mode = d.mode; });
  input.addEventListener("input", apply);

  // フォントの準備を待ってから最初の描画
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(apply);
</script>
</body>
</html>
